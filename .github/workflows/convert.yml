name: Convert GeoJSON to GeoParquet

on:
  push:
    paths:
      - 'data/Vector/*.geojson'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install geopandas pyarrow fiona shapely

      - name: Run conversion
        run: |
          python -c "
          import os, glob, geopandas as gpd
          input_dir = 'data/Vector'
          output_dir = 'data/Vector_Parquet'
          os.makedirs(output_dir, exist_ok=True)
          for f in glob.glob(f'{input_dir}/*.geojson'):
              base = os.path.splitext(os.path.basename(f))[0]
              out = os.path.join(output_dir, f'{base}.parquet')
              print(f'Converting {f} -> {out}')
              gdf = gpd.read_file(f)
              gdf.to_parquet(out)
          "

      - name: Commit and push Parquet files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/Vector_Parquet/
          git commit -m "Auto-convert GeoJSON to GeoParquet" || exit 0
          git push